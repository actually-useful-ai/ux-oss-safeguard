name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: node --check proxy-server.js
      - run: python -m py_compile gpt-oss-safeguard/app.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install -r gpt-oss-safeguard/requirements.txt
      - name: Construct Gradio interface without starting a server
        env:
          GRADIO_ANALYTICS_ENABLED: 'False'
          HF_HUB_OFFLINE: '1'
        run: python -c "import runpy; runpy.run_path('gpt-oss-safeguard/app.py', run_name='import_check')"
